spring.application.name=zhanxu-backend
server.address=127.0.0.1
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/zhanxu_fullstack?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:zhanxu_fullstack_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
app.admin.username=${ADMIN_USERNAME:curator}
app.admin.password=${ADMIN_PASSWORD}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=ZHANXU_SESSION
server.servlet.session.tracking-modes=cookie
