spring.application.name=zhanxu-backend
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/zhanxu_xmu?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:zhanxu_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
